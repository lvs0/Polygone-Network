name: Release

# Publie les binaires précompilés sur GitHub Releases à chaque tag `v*`,
# avec un SHA256SUMS que l'installateur vérifie avant extraction :
#   curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/lvs0/Polygone-Network/main/install.sh | bash
#   → https://github.com/lvs0/Polygone-Network/releases/download/<tag>/polygone-<os>-<arch>.tar.gz

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prepare_release:
    name: Create release once
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the tag release exists before parallel uploads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; assets will be appended."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes
          fi

  release:
    needs: prepare_release
    name: Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-latest
            target: macos-x86_64
          - os: macos-14
            target: macos-aarch64
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-05

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2, 2026-08-06

      - name: Build release binaries
        run: cargo build --release -p polygone-client -p polygone-relay -p polygoned -p polygone-gateway

      - name: Package tarball
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/polygone-${{ matrix.target }}.tar.gz" \
            -C target/release \
            polygone polygone-relay polygoned polygone-gateway \
            -C "$GITHUB_WORKSPACE" web

      - name: Upload binaries
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2, 2026-04-12
        with:
          files: dist/polygone-${{ matrix.target }}.tar.gz

  checksums:
    name: SHA256SUMS
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'polygone-*.tar.gz' \
            --dir dist

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum polygone-*.tar.gz > SHA256SUMS
          echo "SHA256SUMS generated:"
          cat SHA256SUMS

      - name: Upload SHA256SUMS
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2, 2026-04-12
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/SHA256SUMS
          fail_on_unmatched_files: true
