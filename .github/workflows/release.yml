name: Release

# Publie les binaires précompilés sur GitHub Releases à chaque tag `v*`,
# avec un SHA256SUMS que l'installateur vérifie avant extraction :
#   curl -fsSL https://github.com/lvs0/Polygone-Network/releases/latest/download/install.sh | bash
#   → https://github.com/lvs0/Polygone-Network/releases/download/<tag>/polygone-<os>-<arch>.tar.gz

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-latest
            target: macos-x86_64
          - os: macos-14
            target: macos-aarch64
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-05

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2, 2026-08-06

      - name: Build release binaries
        run: cargo build --release -p polygone-client -p polygone-relay -p polygoned

      - name: Package tarball
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/polygone-${{ matrix.target }}.tar.gz" \
            -C target/release \
            polygone polygone-client polygone-relay polygoned

      - name: Upload binaries
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2, 2026-04-12
        with:
          files: dist/polygone-${{ matrix.target }}.tar.gz

  checksums:
    name: SHA256SUMS
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download all release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2, 2026-04-12
        with:
          download_assets: true

      - name: Generate and upload SHA256SUMS
        shell: bash
        run: |
          sha256sum polygone-*.tar.gz > SHA256SUMS
          echo "SHA256SUMS generated:"
          cat SHA256SUMS
        # Re-upload via the release action (second invocation appends).
      - name: Upload SHA256SUMS
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2, 2026-04-12
        with:
          files: SHA256SUMS
          generate_release_notes: true
