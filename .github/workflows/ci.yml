name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Windows est volontairement ABSENT : `daemon/src/resources/mod.rs` porte un
      # `compile_error!` pour cette plateforme, donc ce job ne peut pas être vert.
      # Un job bloquant qui échoue toujours n'est pas une matrice, c'est un badge
      # rouge permanent qui apprend à ignorer la CI. Le portage est suivi par
      # `windows-canary`, autorisé à échouer (CI.1).
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release --workspace

  # Canari de portage, jamais bloquant. Son échec est attendu et documenté :
  # il prouve que la plateforme est encore refusée, pas qu'elle fonctionne.
  windows-canary:
    name: Canary Windows — compilation seule, échec autorisé
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Pourquoi l'échec est attendu
        shell: bash
        run: |
          echo "Windows n'est pas supporté (ETAT-REEL.md §6)."
          grep -n "compile_error" daemon/src/resources/mod.rs || true
      - name: Compilation de l'espace de travail (échec autorisé)
        run: cargo build --workspace

  smoke:
    name: Smoke / ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build release
        run: cargo build --release --workspace
      - name: Shell syntax
        run: |
          for script in install.sh scripts/*.sh; do
            bash -n "$script"
          done
        shell: bash
      - name: Installer smoke (offline)
        run: bash scripts/test-installer.sh
        shell: bash
      - name: CI matrix honesty (CI.1)
        run: node scripts/check-ci-honesty.mjs
      - name: No tracked secret paths (SEC.8)
        run: cargo test -p polygone-client --test no_tracked_secrets
      # P0 : le parcours réseau réel (relais + deux pairs, identités
      # distinctes) est vérifié à chaque CI, pas seulement à la main.
      - name: P0 — parcours réel relais + deux pairs
        run: bash scripts/p0-two-process.sh
        shell: bash
        env:
          POLYGONE_BIN_DIR: target/release
          POLYGONE_SKIP_BUILD: "1"
      - name: Product smoke tests
        run: |
          chmod +x scripts/*.sh
          bash scripts/smoke-commands.sh
          bash scripts/gateway-smoke.sh
        shell: bash
