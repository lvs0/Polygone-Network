[package]
name = "polygone-gateway"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Polygone gateway — HTTP API + static site + pairing"

[[bin]]
name = "polygone-gateway"
path = "src/main.rs"

[dependencies]
polygone-core = { path = "../core" }
# Le client expose le sous-système compute/réseau prouvé (net::borrow_compute,
# exec::run_sandboxed, identity::LocalIdentity). Le gateway le réutilise pour
# l'exécution distante au lieu de réécrire un chemin crypto déjà vérifié.
polygone-client = { path = "../client" }
# Le daemon est une bibliothèque embeddable : la gateway réutilise SON client
# de protocole et SES types (Reply, DaemonConfig) au lieu de les dupliquer —
# la parité du relais est garantie par le compilateur, pas par une copie.
polygoned = { path = "../../daemon" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
hex = "0.4"
base64 = "0.22"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
rand = "0.8"
dirs = { workspace = true }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
# Relais réel en boucle locale pour le test d'intégration compute distant.
polygone-relay = { path = "../relay" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
