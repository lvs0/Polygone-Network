[package]
name = "polygone-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Polygone client — user-side P2P node, listens to polygoned"

# Product command: `polygone` is the unified user-facing binary (D1 TUI + CLI).
[[bin]]
name = "polygone"
path = "src/main.rs"

[dependencies]
polygone-core = { path = "../core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
crossterm = "0.28"
hex = "0.4"
rand = "0.8"
wasmi = "0.42"
wasmi_wasi = "0.42"
