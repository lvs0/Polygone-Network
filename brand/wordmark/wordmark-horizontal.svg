<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 96" role="img" aria-label="Polygone wordmark, horizontal lockup">
  <title>Polygone — horizontal wordmark</title>
  <desc>Mark on the left, wordmark in monospace on the right. Counterpoint tagline below in italic serif, per the Bach principle of paired voices.</desc>
  <rect width="480" height="96" fill="#0f172a"/>
  <!-- Mark scaled to 64x64, vertically centered (y=16) -->
  <g transform="translate(16,16)">
    <polygon points="32,8 52.78,20 52.78,44 32,56 11.22,44 11.22,20"
             fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="miter"/>
    <g fill="#f59e0b">
      <rect x="31" y="13" width="2" height="6"/>
      <rect x="46" y="20.9" width="6" height="2"/>
      <rect x="46" y="41.1" width="6" height="2"/>
      <rect x="31" y="45" width="2" height="6"/>
      <rect x="12" y="41.1" width="6" height="2"/>
      <rect x="12" y="20.9" width="6" height="2"/>
    </g>
    <circle cx="32" cy="32" r="1.5" fill="#f59e0b"/>
  </g>
  <!-- Wordmark in JetBrains Mono. No fallback weights — the discipline is the choice. -->
  <text x="100" y="46" font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="26" font-weight="600" letter-spacing="0.12em" fill="#e2e8f0">POLYGONE</text>
  <!-- Counterpoint (Bach): italic serif tagline, slate-muted. -->
  <text x="100" y="70" font-family="Georgia, 'Times New Roman', serif"
        font-size="13" font-style="italic" fill="#94a3b8">L&#x2019;information n&#x2019;existe pas. Elle traverse.</text>
</svg>
