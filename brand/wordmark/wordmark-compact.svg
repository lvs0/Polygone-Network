<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 32" role="img" aria-label="Polygone mark, compact wordmark">
  <title>Polygone — compact (mark + wordmark, no tagline)</title>
  <desc>For tight spaces: navbars, terminal prompts, code-fence titles. Tagline dropped on purpose.</desc>
  <rect width="220" height="32" fill="#0f172a"/>
  <g transform="translate(4,4) scale(0.375)">
    <polygon points="32,8 52.78,20 52.78,44 32,56 11.22,44 11.22,20"
             fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="miter"/>
    <g fill="#f59e0b">
      <rect x="31" y="13" width="2" height="6"/>
      <rect x="46" y="20.9" width="6" height="2"/>
      <rect x="46" y="41.1" width="6" height="2"/>
      <rect x="31" y="45" width="2" height="6"/>
      <rect x="12" y="41.1" width="6" height="2"/>
      <rect x="12" y="20.9" width="6" height="2"/>
    </g>
    <circle cx="32" cy="32" r="1.5" fill="#f59e0b"/>
  </g>
  <text x="40" y="22" font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="15" font-weight="600" letter-spacing="0.14em" fill="#e2e8f0">POLYGONE</text>
</svg>
