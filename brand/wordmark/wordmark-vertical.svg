<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" role="img" aria-label="Polygone wordmark, vertical lockup">
  <title>Polygone — vertical wordmark</title>
  <rect width="280" height="200" fill="#0f172a"/>
  <!-- Mark, centered horizontally, top -->
  <g transform="translate(108,16)">
    <polygon points="32,8 52.78,20 52.78,44 32,56 11.22,44 11.22,20"
             fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="miter"/>
    <g fill="#f59e0b">
      <rect x="31" y="13" width="2" height="6"/>
      <rect x="46" y="20.9" width="6" height="2"/>
      <rect x="46" y="41.1" width="6" height="2"/>
      <rect x="31" y="45" width="2" height="6"/>
      <rect x="12" y="41.1" width="6" height="2"/>
      <rect x="12" y="20.9" width="6" height="2"/>
    </g>
    <circle cx="32" cy="32" r="1.5" fill="#f59e0b"/>
  </g>
  <!-- Wordmark, centered -->
  <text x="140" y="118" text-anchor="middle"
        font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="22" font-weight="600" letter-spacing="0.12em" fill="#e2e8f0">POLYGONE</text>
  <!-- Counterpoint tagline -->
  <text x="140" y="146" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="12" font-style="italic" fill="#94a3b8">L&#x2019;information n&#x2019;existe pas. Elle traverse.</text>
  <!-- Footnote (Bach): technical voice. -->
  <text x="140" y="172" text-anchor="middle"
        font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="10" letter-spacing="0.08em" fill="#64748b">ML-KEM-1024 · ML-DSA-65 · AES-256-GCM</text>
</svg>
