<?xml version="1.0" encoding="UTF-8"?>
<!-- 1200x630 OpenGraph card. The most-shared surface of the brand. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Polygone — L'information n'existe pas. Elle traverse.">
  <title>Polygone</title>
  <desc>OpenGraph card. Slate field, subtle amber radial gradient suggesting presence without storage. Hex mark on the left, wordmark and counterpoint on the right.</desc>
  <defs>
    <!-- Subtle radial: the matter is at rest, with a single warm spot. Not a glow, not a decoration. -->
    <radialGradient id="warm-spot" cx="20%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Field -->
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect width="1200" height="630" fill="url(#warm-spot)"/>
  <!-- Hairline frame (Bach: every voice has a counter-voice) -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#334155" stroke-width="1"/>
  <!-- Mark, scaled large, vertically centered (y=159), 312x312, x=120 -->
  <g transform="translate(120,159) scale(4.875)">
    <polygon points="32,8 52.78,20 52.78,44 32,56 11.22,44 11.22,20"
             fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="miter"/>
    <g fill="#f59e0b">
      <rect x="31" y="13" width="2" height="6"/>
      <rect x="46" y="20.9" width="6" height="2"/>
      <rect x="46" y="41.1" width="6" height="2"/>
      <rect x="31" y="45" width="2" height="6"/>
      <rect x="12" y="41.1" width="6" height="2"/>
      <rect x="12" y="20.9" width="6" height="2"/>
    </g>
    <circle cx="32" cy="32" r="1.5" fill="#f59e0b"/>
  </g>
  <!-- Wordmark -->
  <text x="540" y="270" font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="78" font-weight="600" letter-spacing="0.10em" fill="#e2e8f0">POLYGONE</text>
  <!-- Counterpoint tagline, italic serif -->
  <text x="540" y="340" font-family="Georgia, 'Times New Roman', serif"
        font-size="32" font-style="italic" fill="#94a3b8">L&#x2019;information n&#x2019;existe pas. Elle traverse.</text>
  <!-- Footnote: technical voice, mono, smaller. Wrapped to 2 lines so nothing is truncated at 1200px width. -->
  <text x="540" y="425" font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="17" letter-spacing="0.10em" fill="#64748b">ML-KEM-1024 (FIPS 203)  ·  ML-DSA-65 (FIPS 204)</text>
  <text x="540" y="450" font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="17" letter-spacing="0.10em" fill="#64748b">Ed25519 (RFC 8032)  ·  AES-256-GCM (NIST SP 800-38D)</text>
  <text x="540" y="475" font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="17" letter-spacing="0.10em" fill="#64748b">BLAKE3  ·  Shamir 4-of-7  ·  zeroize</text>
  <!-- Lower: tagline-against-footnote pairing (Bach) -->
  <line x1="540" y1="500" x2="1080" y2="500" stroke="#334155" stroke-width="1"/>
  <text x="540" y="536" font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="16" letter-spacing="0.18em" fill="#94a3b8">AUCUN COMPTE  ·  AUCUN SERVEUR  ·  AUCUNE TÉLÉMÉTRIE</text>
  <!-- Bottom right: protocol mark -->
  <text x="1080" y="565" text-anchor="end"
        font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="14" letter-spacing="0.10em" fill="#64748b">v2.0.0 · AGPL-3.0 · Rust</text>
</svg>
