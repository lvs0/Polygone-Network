<?xml version="1.0" encoding="UTF-8"?>
<!-- ICO multi-size container reference. Browsers pick the best fit. -->
<!-- For legacy systems that require .ico, convert favicon-32.svg via:
     rsvg-convert -w 32 -h 32 favicon-32.svg -o favicon-32.png
     then: convert favicon-16.png favicon-32.png favicon.ico
     Or use the SVG directly: modern browsers accept SVG favicons via <link rel="icon" type="image/svg+xml" href="...">. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Polygone</title>
  <rect width="32" height="32" fill="#0f172a"/>
  <polygon points="16,4 26.4,10 26.4,22 16,28 5.6,22 5.6,10"
           fill="none" stroke="#f59e0b" stroke-width="1.4" stroke-linejoin="miter"/>
  <circle cx="16" cy="16" r="1.2" fill="#f59e0b"/>
</svg>
